<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UERH - Sistema Integral</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root { --rojo: #c61a2e; --negro: #1a1a1a; --gris-f: #f4f4f4; --blanco: #ffffff; --azul: #2196F3; }
        body { font-family: 'Roboto', sans-serif; background: var(--gris-f); margin: 0; padding-bottom: 60px; }
        
        /* Menú global UERH */
        .nav-uerh-global {
            background: #000;
            display: flex;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 10000;
            border-bottom: 3px solid var(--rojo);
            padding: 0 10px;
            height: 60px;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .nav-uerh-global::-webkit-scrollbar { display: none; }
        .nav-uerh-global a,
        .nav-uerh-global .nav-item-btn {
            color: #888;
            text-decoration: none;
            padding: 0 15px;
            font-weight: 900;
            font-size: 0.7rem;
            text-transform: uppercase;
            border: none;
            background: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            height: 100%;
            transition: .3s;
            white-space: nowrap;
            font-family: inherit;
        }
        .btn-nav-home {
            color: var(--rojo) !important;
            background: #1a1a1a !important;
            border-right: 1px solid #333 !important;
        }
        .nav-uerh-global .nav-item-btn.active {
            color: #fff !important;
            background: var(--rojo) !important;
        }
        .nav-uerh-global a:hover,
        .nav-uerh-global .nav-item-btn:hover { color: #fff; }

        .container { padding: 10px; max-width: 1000px; margin: 25px auto 0; } /* Ligeramente más ancho para la tabla */
        .section { display: none; }
        .section.active { display: block; }

        /* Calendario - Diseño Intacto */
        .menu-fases { display: flex; flex-direction: column; gap: 12px; margin-top: 10px; }
        .fase-card-btn { background: var(--blanco); border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); border: 1px solid #eee; cursor: pointer; text-align: left; }
        #vista-partidos { display: none; }
        .btn-volver { background: var(--negro); color: white; border: none; padding: 10px 15px; border-radius: 8px; margin-bottom: 15px; cursor: pointer; font-weight: bold; font-size: 0.7rem; }
        .fase-header-card { background: var(--blanco); border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid #eee; }
        .fase-titulo-principal { font-size: 1.4rem; font-weight: 700; color: #000; margin: 0; }
        .fase-subtitulo { font-size: 1rem; color: #666; }
        .card { background: var(--blanco); border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 20px; padding: 20px; border: 1px solid #eee; }
        .sub-header { color: var(--rojo); font-size: 0.75rem; text-align: center; font-weight: bold; text-transform: uppercase; margin-bottom: 20px; }
        .game-meta { text-align: center; margin-bottom: 20px; }
        .meta-row { display: flex; justify-content: center; gap: 10px; margin-bottom: 10px; }
        .input-pill { border: 1px solid #ddd; padding: 8px; border-radius: 8px; font-weight: bold; font-size: 0.85rem; text-align: center; width: 100px; }
        .input-sede { display: block; width: 100%; border: none; background: transparent; text-align: center; font-size: 0.7rem; color: #888; text-transform: uppercase; font-weight: bold; }
        .score-display { display: flex; justify-content: space-between; align-items: flex-start; margin: 15px 0; gap: 10px; }
        .team-block { flex: 1; text-align: center; max-width: 38%; }
        .logo-circle { width: 75px; height: 75px; border-radius: 50%; background: #fff; box-shadow: 0 3px 8px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; overflow: hidden; border: 1px solid #f0f0f0; }
        .logo-circle img { width: 80%; height: 80%; object-fit: contain; }
        .logo-circle.empty { background: #fafafa; border: 2px dashed #ddd; box-shadow: none; }
        .select-equipo { width: 100%; border: 1px solid #ddd; border-radius: 6px; font-size: 0.8rem; font-weight: bold; color: #333; padding: 6px; background: #fff; cursor: pointer; }
        .marcador-area { display: flex; align-items: center; gap: 8px; padding-top: 15px; }
        .input-goles { width: 50px; height: 50px; text-align: center; border: 1px solid #eee; border-radius: 12px; font-size: 1.6rem; font-weight: bold; background: #f9f9f9; }
        .btn-update { width: 100%; background: var(--azul); color: white; border: none; padding: 14px; border-radius: 10px; margin-top: 20px; font-weight: bold; cursor: pointer; font-size: 0.8rem; }

        /* --- TABLA DE POSICIONES AMPLIADA --- */
        .tabla-pos { width: 100%; border-collapse: collapse; font-size: 1.1rem; text-align: center; } /* Aumentado tamaño general de fuente */
        .tabla-pos thead { background: var(--negro); color: white; }
        .tabla-pos th { padding: 18px 8px; text-transform: uppercase; font-size: 0.85rem; letter-spacing: 1px; } /* Más espacio en cabezales */
        .tabla-pos td { padding: 20px 8px; border-bottom: 1px solid #eee; } /* Filas mucho más altas */
        .col-equipo { text-align: left; display: flex; align-items: center; gap: 12px; padding-left: 15px !important; }
        .mini-logo { width: 35px; height: 35px; object-fit: contain; } /* Logos de tabla más grandes */
        .pts-badge { font-weight: 900; color: var(--rojo); font-size: 1.3rem; } /* Puntos resaltados */

        /* Llaves Playoffs / Final */
        .bracket-wrap { background:#fff; border:1px solid #eee; border-radius:15px; padding:18px; margin-bottom:20px; overflow-x:auto; }
        .bracket-title { font-size:1rem; font-weight:900; text-transform:uppercase; margin-bottom:5px; }
        .bracket-note { color:#777; font-size:.72rem; margin-bottom:18px; }
        .bracket-grid { display:grid; grid-template-columns:minmax(230px,1fr) 70px minmax(230px,1fr); gap:12px; align-items:center; min-width:570px; }
        .bracket-col { display:flex; flex-direction:column; gap:18px; }
        .series-card { border:1px solid #ddd; border-radius:12px; overflow:hidden; background:#fafafa; }
        .series-head { background:#1a1a1a; color:#fff; padding:7px 10px; font-size:.65rem; font-weight:900; text-transform:uppercase; }
        .series-team { display:flex; align-items:center; gap:8px; padding:9px 10px; border-top:1px solid #eee; font-size:.78rem; font-weight:700; min-height:34px; }
        .series-team img { width:25px; height:25px; object-fit:contain; }
        .seed { color:#999; width:18px; font-size:.65rem; }
        .series-wins { margin-left:auto; background:#fff; border-radius:6px; min-width:25px; padding:3px 6px; text-align:center; font-weight:900; }
        .bracket-arrow { text-align:center; font-size:2rem; color:#bbb; font-weight:300; }
        .final-card { border:2px solid var(--rojo); }
        .final-card .series-head { background:var(--rojo); }
        .third-card { margin-top:12px; }
        @media(max-width:600px){ .bracket-wrap{padding:12px;} }

        /* Llaves compactas estilo cuadro deportivo */
        .bracket-wrap { padding:20px; }
        .bracket-title { font-size:1.15rem; letter-spacing:.3px; }
        .bracket-note { line-height:1.45; margin-bottom:16px; }
        .playoff-match { position:relative; display:grid; grid-template-columns:1fr 46px 1fr; align-items:center; gap:12px;
            background:#fff; border:1px solid #e5e5e5; border-radius:14px; padding:14px; margin:12px 0; }
        .playoff-match::after { content:"VS"; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
            width:38px; height:38px; border-radius:50%; background:var(--negro); color:#fff; display:flex; align-items:center;
            justify-content:center; font-size:.68rem; font-weight:900; }
        .playoff-side { min-width:0; display:flex; align-items:center; gap:10px; }
        .playoff-side.right { flex-direction:row-reverse; text-align:right; }
        .seed-circle { flex:0 0 34px; width:34px; height:34px; border-radius:50%; background:#f1f1f1; display:flex;
            align-items:center; justify-content:center; font-size:.72rem; font-weight:900; color:#555; }
        .playoff-name { font-size:.86rem; font-weight:900; line-height:1.15; }
        .playoff-label { font-size:.58rem; color:#888; text-transform:uppercase; margin-top:3px; letter-spacing:.5px; }
        .match-label { color:var(--rojo); font-size:.68rem; font-weight:900; text-transform:uppercase; margin:18px 0 5px; }
        .bestof { display:inline-block; background:#f3f3f3; border-radius:999px; padding:5px 9px; font-size:.62rem;
            font-weight:800; color:#555; margin-left:6px; }
        @media(max-width:520px){
            .playoff-match { grid-template-columns:1fr 36px 1fr; gap:6px; padding:12px 8px; }
            .playoff-match::after { width:32px; height:32px; font-size:.58rem; }
            .seed-circle { flex-basis:28px; width:28px; height:28px; }
            .playoff-name { font-size:.72rem; }
            .playoff-label { font-size:.52rem; }
        }
</style>
</head>
<body>

    <nav class="nav-uerh-global">
        <a href="index.html" class="btn-nav-home">INICIO</a>
        <button type="button" class="nav-item-btn active" id="btn-nav-cal" onclick="showTab('cal')">Calendario</button>
        <button type="button" class="nav-item-btn" id="btn-nav-pos" onclick="showTab('pos')">Posiciones</button>
        <a href="Equipos.html">Equipos</a>
        <a href="Estadisticasnuevo.html">Estadísticas</a>
    </nav>

    <div class="container">
        <div id="cal" class="section active">
            <div id="menu-fases" class="menu-fases">
                <div class="fase-card-btn" onclick="verFase('regular')">
                    <h3>Temporada Regular</h3>
                    <p>3 Rondas</p>
                </div>
                <div class="fase-card-btn" onclick="verFase('playoffs')">
                    <h3>Playoffs (Best of 3)</h3>
                    <p>Juegos 1, 2 y 3</p>
                </div>
                <div class="fase-card-btn" onclick="verFase('final')">
                    <h3>Gran Final</h3>
                    <p>Final y 3er Puesto</p>
                </div>
            </div>
            <div id="vista-partidos">
                <button class="btn-volver" onclick="volverAlMenu()">← VOLVER AL MENÚ</button>
                <div id="fase-header-dinamico"></div>
                <div id="render-partidos-fase"></div>
            </div>
        </div>
        
        <div id="pos" class="section"></div>
        <div id="pla" class="section"></div>
        <div id="est" class="section"></div>
        <div id="san" class="section"></div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://uerh-t2026-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let DATA = {};
        let faseActiva = null;

        const ESTRUCTURA_FASES = {
            regular: {
                titulo: "Temporada Regular", sub: "3 Rondas",
                ids: ['ronda1-fecha1A', 'ronda1-fecha1B', 'ronda1-fecha2A', 'ronda1-fecha2B', 'ronda1-fecha3A', 'ronda1-fecha3B', 'ronda2-fecha1A', 'ronda2-fecha1B', 'ronda2-fecha2A', 'ronda2-fecha2B', 'ronda2-fecha3A', 'ronda2-fecha3B', 'ronda3-fecha1A', 'ronda3-fecha1B', 'ronda3-fecha2A', 'ronda3-fecha2B', 'ronda3-fecha3A', 'ronda3-fecha3B']
            },
            playoffs: {
                titulo: "Playoffs (Best of 3)", sub: "Juegos 1, 2 y 3",
                ids: ['juego1-semifinalA', 'juego1-semifinalB', 'juego2-semifinalA', 'juego2-semifinalB', 'juego3-semifinalA', 'juego3-semifinalB']
            },
            final: {
                titulo: "Gran Final", sub: "Final y 3er Puesto",
                ids: ['juego1-3puesto', 'juego1-granfinal', 'juego2-3puesto', 'juego2-granfinal', 'juego3-3puesto', 'juego3-granfinal']
            }
        };

        db.ref().on('value', snap => {
            DATA = snap.val() || {};
            if(faseActiva) verFase(faseActiva);
            renderPosiciones();
            if(window.parent?.esAdmin !== false) sincronizarCrucesAutomaticos().catch(()=>{});
        });

        function showTab(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));

            const seccion = document.getElementById(id);
            if (seccion) seccion.classList.add('active');

            const btnCal = document.getElementById('btn-nav-cal');
            const btnPos = document.getElementById('btn-nav-pos');
            if (btnCal) btnCal.classList.toggle('active', id === 'cal');
            if (btnPos) btnPos.classList.toggle('active', id === 'pos');

            if (id !== 'cal') volverAlMenu();
        }

        function renderPosiciones() {
            const res = DATA.config?.resultados || {};
            const logos = DATA.config?.logos || {};
            const equiposNombres = Object.keys(logos);
            let tabla = {};
            equiposNombres.forEach(nombre => {
                tabla[nombre] = { nombre: nombre, pj: 0, pg: 0, pe: 0, pp: 0, gf: 0, gc: 0, pts: 0 };
            });

            Object.keys(res).forEach(id => {
                const p = res[id];
                if (id.startsWith('ronda') && p.individuales) {
                    const loc = p.equipos?.local;
                    const vis = p.equipos?.visitante;
                    if (loc && vis && tabla[loc.nombre] && tabla[vis.nombre]) {
                        const gL = parseInt(loc.goles) || 0, gV = parseInt(vis.goles) || 0;
                        tabla[loc.nombre].pj++; tabla[vis.nombre].pj++;
                        tabla[loc.nombre].gf += gL; tabla[loc.nombre].gc += gV;
                        tabla[vis.nombre].gf += gV; tabla[vis.nombre].gc += gL;
                        // PUNTOS UERH:
                        // Victoria normal/WO = 3-0
                        // Partido definido en OT = 2 al ganador y 1 al perdedor.
                        // Primero detectamos explícitamente si el partido terminó en overtime.
                        const modoFin = String(p.metadata?.modo_fin || p.modo_fin || p.periodo || '').toUpperCase();
                        const esOT = modoFin === 'OT' || modoFin === 'OVERTIME';

                        const ptsLGuardados = Number(loc.puntos);
                        const ptsVGuardados = Number(vis.puntos);
                        const hayPuntosGuardados = Number.isFinite(ptsLGuardados) && Number.isFinite(ptsVGuardados);

                        let ptsPartidoL, ptsPartidoV;

                        if (gL > gV) {
                            tabla[loc.nombre].pg++;
                            tabla[vis.nombre].pp++;
                            if (esOT) {
                                ptsPartidoL = 2;
                                ptsPartidoV = 1;
                            } else if (hayPuntosGuardados) {
                                ptsPartidoL = ptsLGuardados;
                                ptsPartidoV = ptsVGuardados;
                            } else {
                                ptsPartidoL = 3;
                                ptsPartidoV = 0;
                            }
                        }
                        else if (gL < gV) {
                            tabla[vis.nombre].pg++;
                            tabla[loc.nombre].pp++;
                            if (esOT) {
                                ptsPartidoL = 1;
                                ptsPartidoV = 2;
                            } else if (hayPuntosGuardados) {
                                ptsPartidoL = ptsLGuardados;
                                ptsPartidoV = ptsVGuardados;
                            } else {
                                ptsPartidoL = 0;
                                ptsPartidoV = 3;
                            }
                        }
                        else {
                            tabla[loc.nombre].pe++;
                            tabla[vis.nombre].pe++;
                            ptsPartidoL = 1;
                            ptsPartidoV = 1;
                        }

                        tabla[loc.nombre].pts += ptsPartidoL;
                        tabla[vis.nombre].pts += ptsPartidoV;
                    }
                }
            });

            const tablaSorted = Object.values(tabla).sort((a, b) => b.pts !== a.pts ? b.pts - a.pts : (b.gf - b.gc) - (a.gf - a.gc));
            let html = `<div class="card" style="padding:0; overflow-x:auto;"><table class="tabla-pos"><thead><tr><th>#</th><th style="text-align:left; padding-left:15px;">EQUIPO</th><th>PJ</th><th>PG</th><th>PE</th><th>PP</th><th>GF</th><th>GC</th><th>DG</th><th style="background:var(--rojo)">PTS</th></tr></thead><tbody>`;
            tablaSorted.forEach((eq, index) => {
                const dg = eq.gf - eq.gc;
                html += `<tr><td style="font-weight:bold;">${index + 1}</td><td class="col-equipo"><img src="${logos[eq.nombre]}" class="mini-logo"><span style="font-weight:bold;">${eq.nombre}</span></td><td>${eq.pj}</td><td>${eq.pg}</td><td>${eq.pe}</td><td>${eq.pp}</td><td>${eq.gf}</td><td>${eq.gc}</td><td style="color:${dg > 0 ? 'green' : dg < 0 ? 'red' : 'gray'}; font-weight:bold;">${dg > 0 ? '+' + dg : dg}</td><td class="pts-badge">${eq.pts}</td></tr>`;
            });
            html += `</tbody></table></div>`;
            document.getElementById('pos').innerHTML = html;
        }


        function obtenerTablaRegular() {
            const res = DATA.config?.resultados || {};
            const logos = DATA.config?.logos || {};
            const tabla = {};
            Object.keys(logos).forEach(nombre => tabla[nombre] = { nombre, pj:0, gf:0, gc:0, pts:0 });

            Object.keys(res).forEach(id => {
                // IMPORTANTE: la clasificación termina en Ronda 3.
                // Playoffs, 3er puesto y Final NO suman PJ, goles ni puntos a esta tabla.
                if (!id.startsWith('ronda')) return;
                const p = res[id], l = p.equipos?.local, v = p.equipos?.visitante;
                if (!l || !v || !tabla[l.nombre] || !tabla[v.nombre] || !p.individuales) return;

                const gl = parseInt(l.goles) || 0, gv = parseInt(v.goles) || 0;
                const modo = String(p.metadata?.modo_fin || p.modo_fin || p.periodo || '').toUpperCase();
                const ot = modo === 'OT' || modo === 'OVERTIME';
                const pl = Number(l.puntos), pv = Number(v.puntos);
                const guardados = Number.isFinite(pl) && Number.isFinite(pv);

                tabla[l.nombre].pj++; tabla[v.nombre].pj++;
                tabla[l.nombre].gf += gl; tabla[l.nombre].gc += gv;
                tabla[v.nombre].gf += gv; tabla[v.nombre].gc += gl;

                if (ot && gl !== gv) {
                    tabla[l.nombre].pts += gl > gv ? 2 : 1;
                    tabla[v.nombre].pts += gv > gl ? 2 : 1;
                } else if (guardados) {
                    tabla[l.nombre].pts += pl; tabla[v.nombre].pts += pv;
                } else if (gl !== gv) {
                    tabla[l.nombre].pts += gl > gv ? 3 : 0;
                    tabla[v.nombre].pts += gv > gl ? 3 : 0;
                }
            });

            return Object.values(tabla).sort((a,b) =>
                b.pts-a.pts || (b.gf-b.gc)-(a.gf-a.gc) || b.gf-a.gf || a.nombre.localeCompare(b.nombre)
            );
        }

        function ganadorPartido(id) {
            const p = DATA.config?.resultados?.[id];
            if (!p) return null;
            const l=p.equipos?.local, v=p.equipos?.visitante;
            if (!l || !v) return null;
            const puntuado=(Number(l.puntos)||0)+(Number(v.puntos)||0)>0 || p.estado==='finalizado';
            if (!puntuado) return null;
            const gl=parseInt(l.goles)||0, gv=parseInt(v.goles)||0;
            if (gl===gv) return null;
            return gl>gv ? l.nombre : v.nombre;
        }

        function victoriasSerie(ids, equipoA, equipoB) {
            let a=0,b=0;
            ids.forEach(id => {
                const g=ganadorPartido(id);
                if(g===equipoA) a++;
                if(g===equipoB) b++;
            });
            return [a,b];
        }

        function equipoHtml(nombre, seed, wins, logos) {
            const logo = nombre && logos[nombre] ? `<img src="${logos[nombre]}">` : `<span style="width:25px"></span>`;
            return `<div class="series-team"><span class="seed">${seed || ''}</span>${logo}<span>${nombre || 'POR DEFINIR'}</span><span class="series-wins">${wins ?? '-'}</span></div>`;
        }

        function faseRegularCompleta() {
            const res=DATA.config?.resultados||{};
            return ESTRUCTURA_FASES.regular.ids.every(id=>{
                const p=res[id], l=p?.equipos?.local, v=p?.equipos?.visitante;
                if(!l||!v) return false;
                const puntos=(Number(l.puntos)||0)+(Number(v.puntos)||0);
                return p.estado==='finalizado' || puntos>0;
            });
        }

        function datosCruces() {
            const logos=DATA.config?.logos||{};
            const rank=obtenerTablaRegular();
            if(rank.length<4) return null;
            const e1=rank[0].nombre,e2=rank[1].nombre,e3=rank[2].nombre,e4=rank[3].nombre;
            const idsA=['juego1-semifinalA','juego2-semifinalA','juego3-semifinalA'];
            const idsB=['juego1-semifinalB','juego2-semifinalB','juego3-semifinalB'];
            const [a1,a4]=victoriasSerie(idsA,e1,e4), [b2,b3]=victoriasSerie(idsB,e2,e3);
            const finalA=a1>=2?e1:a4>=2?e4:null, pierdeA=a1>=2?e4:a4>=2?e1:null;
            const finalB=b2>=2?e2:b3>=2?e3:null, pierdeB=b2>=2?e3:b3>=2?e2:null;
            return {logos,rank,e1,e2,e3,e4,a1,a4,b2,b3,finalA,finalB,pierdeA,pierdeB};
        }

        function cuadroPlayoffs() {
            // La llave de PLAYOFFS siempre debe existir visualmente.
            // Antes de terminar la fase regular muestra posiciones, no nombres.
            const d = datosCruces();
            const completa = faseRegularCompleta();

            const nombre1 = (completa && d?.e1) ? d.e1 : '1.º DE FASE REGULAR';
            const nombre4 = (completa && d?.e4) ? d.e4 : '4.º DE FASE REGULAR';
            const nombre2 = (completa && d?.e2) ? d.e2 : '2.º DE FASE REGULAR';
            const nombre3 = (completa && d?.e3) ? d.e3 : '3.º DE FASE REGULAR';

            const estado = completa
                ? 'Cruces definitivos según la tabla final de la Temporada Regular.'
                : 'Los equipos se definirán al finalizar la 3.ª ronda.';

            const lado = (nombre, seed, ladoTxt) => `
                <div class="playoff-side ${ladoTxt === 'right' ? 'right' : ''}">
                    <div class="seed-circle">${seed}</div>
                    <div>
                        <div class="playoff-name">${nombre}</div>
                        <div class="playoff-label">${completa ? 'CLASIFICADO' : 'POSICIÓN DE CLASIFICACIÓN'}</div>
                    </div>
                </div>`;

            return `
            <div class="bracket-wrap" style="display:block !important;">
                <div class="bracket-title">LLAVES DE PLAYOFFS</div>
                <div class="bracket-note">
                    ${estado}
                    <span class="bestof">MEJOR DE 3</span>
                </div>

                <div class="match-label">SEMIFINAL A</div>
                <div class="playoff-match">
                    ${lado(nombre1,'1.º','left')}
                    <div></div>
                    ${lado(nombre4,'4.º','right')}
                </div>

                <div class="match-label">SEMIFINAL B</div>
                <div class="playoff-match">
                    ${lado(nombre2,'2.º','left')}
                    <div></div>
                    ${lado(nombre3,'3.º','right')}
                </div>
            </div>`;
        }

        function cuadroFinal() {
            // La llave de FINAL también siempre debe existir visualmente.
            const d = datosCruces();

            const finalA   = d?.finalA  || 'GANADOR SEMIFINAL A';
            const finalB   = d?.finalB  || 'GANADOR SEMIFINAL B';
            const terceroA = d?.pierdeA || 'PERDEDOR SEMIFINAL A';
            const terceroB = d?.pierdeB || 'PERDEDOR SEMIFINAL B';
            const definidas = !!(d?.finalA && d?.finalB);

            const lado = (nombre, marca, sub, ladoTxt) => `
                <div class="playoff-side ${ladoTxt === 'right' ? 'right' : ''}">
                    <div class="seed-circle">${marca}</div>
                    <div>
                        <div class="playoff-name">${nombre}</div>
                        <div class="playoff-label">${sub}</div>
                    </div>
                </div>`;

            return `
            <div class="bracket-wrap" style="display:block !important;">
                <div class="bracket-title">LLAVES DE FINAL</div>
                <div class="bracket-note">
                    ${definidas
                        ? 'Cruces definidos automáticamente según los resultados de las semifinales.'
                        : 'Los equipos se definirán automáticamente al terminar las semifinales.'}
                    <span class="bestof">MEJOR DE 3</span>
                </div>

                <div class="match-label">GRAN FINAL</div>
                <div class="playoff-match">
                    ${lado(finalA,'A', definidas ? 'CLASIFICADO' : 'GANADOR SEMIFINAL A','left')}
                    <div></div>
                    ${lado(finalB,'B', definidas ? 'CLASIFICADO' : 'GANADOR SEMIFINAL B','right')}
                </div>

                <div class="match-label">3.er Y 4.º PUESTO</div>
                <div class="playoff-match">
                    ${lado(terceroA,'A', definidas ? 'CLASIFICADO' : 'PERDEDOR SEMIFINAL A','left')}
                    <div></div>
                    ${lado(terceroB,'B', definidas ? 'CLASIFICADO' : 'PERDEDOR SEMIFINAL B','right')}
                </div>
            </div>`;
        }

        function sincronizarCrucesAutomaticos() {
            if(!faseRegularCompleta()) return Promise.resolve();
            const d=datosCruces(); if(!d) return Promise.resolve();
            const u={};
            ['juego1-semifinalA','juego2-semifinalA','juego3-semifinalA'].forEach(id=>{
                const juego2=id.startsWith('juego2-');
                u[`config/resultados/${id}/equipos/local/nombre`]=juego2?d.e4:d.e1;
                u[`config/resultados/${id}/equipos/visitante/nombre`]=juego2?d.e1:d.e4;
            });
            ['juego1-semifinalB','juego2-semifinalB','juego3-semifinalB'].forEach(id=>{
                const juego2=id.startsWith('juego2-');
                u[`config/resultados/${id}/equipos/local/nombre`]=juego2?d.e3:d.e2;
                u[`config/resultados/${id}/equipos/visitante/nombre`]=juego2?d.e2:d.e3;
            });
            if(d.finalA&&d.finalB){
                ['juego1-granfinal','juego2-granfinal','juego3-granfinal'].forEach(id=>{
                    const juego2=id.startsWith('juego2-');
                    u[`config/resultados/${id}/equipos/local/nombre`]=juego2?d.finalB:d.finalA;
                    u[`config/resultados/${id}/equipos/visitante/nombre`]=juego2?d.finalA:d.finalB;
                });
                ['juego1-3puesto','juego2-3puesto','juego3-3puesto'].forEach(id=>{
                    const juego2=id.startsWith('juego2-');
                    u[`config/resultados/${id}/equipos/local/nombre`]=juego2?d.pierdeB:d.pierdeA;
                    u[`config/resultados/${id}/equipos/visitante/nombre`]=juego2?d.pierdeA:d.pierdeB;
                });
            }
            return db.ref().update(u);
        }


        function verFase(key) {
            faseActiva = key;
            const fase = ESTRUCTURA_FASES[key], res = DATA.config?.resultados || {}, logos = DATA.config?.logos || {}, equiposArr = Object.keys(logos);
            document.getElementById('menu-fases').style.display = 'none';
            document.getElementById('vista-partidos').style.display = 'block';
            let extra = '';
            if (key === 'playoffs') {
                extra = cuadroPlayoffs();
            } else if (key === 'final') {
                extra = cuadroFinal();
            }

            // Primero el encabezado + la llave. Debajo queda la planificación de partidos.
            document.getElementById('fase-header-dinamico').innerHTML =
                `<div class="fase-header-card">
                    <div class="fase-titulo-principal">${fase.titulo}</div>
                    <div class="fase-subtitulo">${fase.sub}</div>
                 </div>${extra}`;
            let html = '';

            // En el planificador se muestran primero los partidos que todavía
            // tienen datos de planificación pendientes.
            const idsOrdenados = [...fase.ids].sort((a, b) => {
                const partidoA = res[a];
                const partidoB = res[b];

                const faltaA = !partidoA?.fecha || !partidoA?.hora || !partidoA?.sede ||
                               !partidoA?.equipos?.local?.nombre || !partidoA?.equipos?.visitante?.nombre;
                const faltaB = !partidoB?.fecha || !partidoB?.hora || !partidoB?.sede ||
                               !partidoB?.equipos?.local?.nombre || !partidoB?.equipos?.visitante?.nombre;

                if (faltaA !== faltaB) return faltaA ? -1 : 1;
                return fase.ids.indexOf(a) - fase.ids.indexOf(b);
            });

            const cruces = datosCruces();

            idsOrdenados.forEach(id => {
                let d = res[id];

                // Mientras la fase regular no haya terminado, los partidos de semifinal
                // muestran automáticamente los cruces PROVISIONALES de la tabla actual.
                // Es solo visual: no se guardan en Firebase hasta que la fase regular termine.
                if (key === 'playoffs' && cruces) {
                    const provisional = JSON.parse(JSON.stringify(d || {}));
                    provisional.equipos = provisional.equipos || {};
                    provisional.equipos.local = provisional.equipos.local || {};
                    provisional.equipos.visitante = provisional.equipos.visitante || {};

                    // Localía alternada en series al mejor de 3:
                    // Juego 1: mejor clasificado de local
                    // Juego 2: se invierte la localía
                    // Juego 3: vuelve a ser local el mejor clasificado
                    const juego2 = id.startsWith('juego2-');

                    if (id.includes('semifinalA')) {
                        provisional.equipos.local.nombre = juego2 ? '4.º DE FASE REGULAR' : '1.º DE FASE REGULAR';
                        provisional.equipos.visitante.nombre = juego2 ? '1.º DE FASE REGULAR' : '4.º DE FASE REGULAR';
                    } else if (id.includes('semifinalB')) {
                        provisional.equipos.local.nombre = juego2 ? '3.º DE FASE REGULAR' : '2.º DE FASE REGULAR';
                        provisional.equipos.visitante.nombre = juego2 ? '2.º DE FASE REGULAR' : '3.º DE FASE REGULAR';
                    }
                    d = provisional;
                }

                // En la fase Final también se muestran automáticamente los equipos
                // cuando las semifinales ya tienen ganador/perdedor definidos.
                if (key === 'final' && cruces) {
                    const automatico = JSON.parse(JSON.stringify(d || {}));
                    automatico.equipos = automatico.equipos || {};
                    automatico.equipos.local = automatico.equipos.local || {};
                    automatico.equipos.visitante = automatico.equipos.visitante || {};

                    const juego2 = id.startsWith('juego2-');
                    if (id.includes('granfinal') && cruces.finalA && cruces.finalB) {
                        automatico.equipos.local.nombre = juego2 ? cruces.finalB : cruces.finalA;
                        automatico.equipos.visitante.nombre = juego2 ? cruces.finalA : cruces.finalB;
                    } else if (id.includes('3puesto') && cruces.pierdeA && cruces.pierdeB) {
                        automatico.equipos.local.nombre = juego2 ? cruces.pierdeB : cruces.pierdeA;
                        automatico.equipos.visitante.nombre = juego2 ? cruces.pierdeA : cruces.pierdeB;
                    }
                    d = automatico;
                }

                html += `<div class="card"><div class="sub-header">${id.replace(/-/g, ' ').toUpperCase()}</div>${renderGameUI(id, d, logos, equiposArr)}</div>`;
            });
            document.getElementById('render-partidos-fase').innerHTML = html;
            if(window.flatpickr) {
                flatpickr(".fp", { dateFormat: "d-M" });
                flatpickr(".tp", { enableTime: true, noCalendar: true, dateFormat: "H:i", time_24hr: true });
            }
        }

        function volverAlMenu() {
            faseActiva = null;
            document.getElementById('menu-fases').style.display = 'flex';
            document.getElementById('vista-partidos').style.display = 'none';
        }

        function renderGameUI(id, d, logos, equiposArr) {
            const locNombre = d?.equipos?.local?.nombre || "", visNombre = d?.equipos?.visitante?.nombre || "";
            const locLogo = logos[locNombre] ? `<img src="${logos[locNombre]}">` : "";
            const visLogo = logos[visNombre] ? `<img src="${logos[visNombre]}">` : "";
            return `<div class="game-meta"><div class="meta-row"><input type="text" class="input-pill fp" id="d-${id}" value="${d?.fecha || ''}" placeholder="FECHA"><input type="text" class="input-pill tp" id="h-${id}" value="${d?.hora || ''}" placeholder="HORA"></div><input type="text" class="input-sede" id="s-${id}" value="${d?.sede || ''}" placeholder="LUGAR / SEDE"></div><div class="score-display"><div class="team-block"><div class="logo-circle ${!locLogo ? 'empty' : ''}">${locLogo}</div><select class="select-equipo" id="l-${id}"><option value="" ${!locNombre ? 'selected' : ''}>-- Seleccionar --</option>${equiposArr.map(e => `<option value="${e}" ${e === locNombre ? 'selected' : ''}>${e}</option>`).join('')}</select></div><div class="marcador-area"><input type="number" class="input-goles" id="gl-${id}" value="${d?.equipos?.local?.goles || 0}"><span style="color:#ccc; font-weight:bold; font-size:1.5rem;">-</span><input type="number" class="input-goles" id="gv-${id}" value="${d?.equipos?.visitante?.goles || 0}"></div><div class="team-block"><div class="logo-circle ${!visLogo ? 'empty' : ''}">${visLogo}</div><select class="select-equipo" id="v-${id}"><option value="" ${!visNombre ? 'selected' : ''}>-- Seleccionar --</option>${equiposArr.map(e => `<option value="${e}" ${e === visNombre ? 'selected' : ''}>${e}</option>`).join('')}</select></div></div><button class="btn-update" onclick="guardarPartido('${id}')">ACTUALIZAR DATOS</button>`;
        }

        function guardarPartido(id) {
            const updates = {};
            updates[`config/resultados/${id}/fecha`] = document.getElementById(`d-${id}`).value;
            updates[`config/resultados/${id}/hora`] = document.getElementById(`h-${id}`).value;
            updates[`config/resultados/${id}/sede`] = document.getElementById(`s-${id}`).value;
            updates[`config/resultados/${id}/equipos/local/nombre`] = document.getElementById(`l-${id}`).value;
            updates[`config/resultados/${id}/equipos/local/goles`] = parseInt(document.getElementById(`gl-${id}`).value) || 0;
            updates[`config/resultados/${id}/equipos/visitante/nombre`] = document.getElementById(`v-${id}`).value;
            updates[`config/resultados/${id}/equipos/visitante/goles`] = parseInt(document.getElementById(`gv-${id}`).value) || 0;
            db.ref().update(updates).then(() => alert("Sincronizado con éxito.")).catch(err => alert("Error: " + err.message));
        }

        function renderEstadisticas() {
            const container = document.getElementById('est');
            const res = DATA.config?.resultados || {};
            const inscritos = DATA.inscripciones ? Object.values(DATA.inscripciones) : [];
            const LOGOS = DATA.config?.logos || {};
            let goleadores = {}, asistidores = {};

            Object.keys(res).forEach(id => {
                const p = res[id];
                if (p.individuales) {
                    ['local', 'visitante'].forEach(lado => {
                        const stats = p.individuales[lado];
                        const eq = p.equipos?.[lado]?.nombre;
                        if (stats.goles) Object.entries(stats.goles).forEach(([j, v]) => { if(!goleadores[j]) goleadores[j]={v:0, eq:eq}; goleadores[j].v += v; });
                        if (stats.asistencias) Object.entries(stats.asistencias).forEach(([j, v]) => { if(!asistidores[j]) asistidores[j]={v:0, eq:eq}; asistidores[j].v += v; });
                    });
                }
            });

            const crearRanking = (titulo, data) => {
                const sorted = Object.entries(data).map(([n, d]) => ({ n, ...d })).sort((a, b) => b.v - a.v).slice(0, 10);
                let h = `<div class="card"><h3 style="color:var(--rojo); font-size:0.9rem; text-transform:uppercase; border-bottom:1px solid #eee; padding-bottom:10px;">${titulo}</h3>`;
                sorted.forEach((j, i) => {
                    const nombreLimpio = j.n.includes("#") ? j.n.split(" ").slice(1).join(" ").trim().toLowerCase() : j.n.trim().toLowerCase();
                    const reg = inscritos.find(ins => (ins.jugadorName || "").toLowerCase().includes(nombreLimpio)) || {};
                    h += `<div style="display:flex; align-items:center; padding:10px 0; border-bottom:1px solid #f9f9f9;">
                        <span style="width:20px; font-weight:bold; color:#ccc;">${i+1}</span>
                        <div style="position:relative; width:40px; height:40px; margin: 0 10px;">
                            <img src="${reg.fotoCarnet || 'https://i.ibb.co/LzN868X/default-avatar.png'}" style="width:100%; height:100%; border-radius:50%; object-fit:cover;" onerror="this.src='https://i.ibb.co/LzN868X/default-avatar.png'">
                            <img src="${LOGOS[j.eq] || ''}" style="position:absolute; bottom:0; right:0; width:15px; height:15px; background:white; border-radius:50%; border:1px solid #ddd;">
                        </div>
                        <div style="flex:1;"><div style="font-weight:bold; font-size:0.8rem;">${j.n}</div><div style="font-size:0.6rem; color:#888;">${j.eq}</div></div>
                        <div style="background:var(--negro); color:white; padding:2px 8px; border-radius:4px; font-weight:bold;">${j.v}</div>
                    </div>`;
                });
                return h + `</div>`;
            };
            container.innerHTML = crearRanking("Máximos Goleadores", goleadores) + crearRanking("Líderes en Asistencias", asistidores);
        }

        function autoSincronizarFotos() {
            db.ref().once('value', snap => {
                const DATA = snap.val();
                if (!DATA.inscripciones || !DATA.config?.jugadores) return;
                const inscripciones = Object.values(DATA.inscripciones);
                const jugadores = DATA.config.jugadores;
                const actualizaciones = {};
                let huboCambios = false;
                Object.keys(jugadores).forEach(id => {
                    const j = jugadores[id];
                    const nombreBusqueda = (j.info || j.jugadorName || "").toLowerCase().trim();
                    const nombreLimpio = nombreBusqueda.includes("#") ? nombreBusqueda.split(" ").slice(1).join(" ") : nombreBusqueda;
                    const registro = inscripciones.find(ins => {
                        const nDB = (ins.jugadorName || "").toLowerCase().trim();
                        const nCap = (ins.capitanName || "").toLowerCase().trim();
                        return nDB.includes(nombreLimpio) || nCap.includes(nombreLimpio);
                    });
                    if (registro && registro.fotoCarnet && j.fotoUrl !== registro.fotoCarnet) {
                        actualizaciones[`config/jugadores/${id}/fotoUrl`] = registro.fotoCarnet;
                        huboCambios = true;
                    }
                });
                if (huboCambios) { db.ref().update(actualizaciones); }
            });
        }
        autoSincronizarFotos();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>

<script>
    // FUNCIÓN DE BLOQUEO DE SEGURIDAD UERH
    function aplicarSeguridadGlobal() {
        const esAdmin = window.parent.esAdmin; // Consulta al Sistema Global si es admin

        if (!esAdmin) {
            console.log("Modo Invitado: Bloqueando funciones de escritura.");
            
            // 1. Deshabilitar todas las funciones de Firebase de escritura
            if (typeof db !== 'undefined') {
                db.ref = function() { 
                    console.error("Acceso denegado: No tienes permisos de administrador.");
                    return { set: () => {}, update: () => {}, push: () => ({ set: () => {} }), remove: () => {} };
                };
            }

            // 2. Eliminar visualmente cualquier botón de edición/guardado
            const selectoresBloqueo = [
                '.btn-update', '.btn-save', '.btn-edit', 
                'button:not(.btn-toggle):not(.nav-item-btn):not(.btn-volver)', // Mantiene visible la navegación
                'input', 'select', '.modal'
            ];
            
            selectoresBloqueo.forEach(sel => {
                document.querySelectorAll(sel).forEach(el => {
                    el.style.display = 'none'; 
                    el.disabled = true;
                });
            });

            // 3. Bloquear funciones específicas de tus archivos
            window.abrirFicha = function() { alert("Acceso restringido a administradores."); };
            window.guardarManual = function() { return false; };
        }
    }

</script>
